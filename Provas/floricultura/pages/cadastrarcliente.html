<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Cliente</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

<body>
    <h1>Adicionar Cliente</h1>
    <form action="adicionarcliente.php">
        <div class="form-group">     
            <input type="text" id="nome" name="nome" class="form-control" 
                    placeholder="Nome Completo">
        </div>
        <div class="form-group">
            <input type="email" id="email" name="email" class="form-control" 
                placeholder="E-mail">
        </div>
        <div class="form-group">
            <input type="password" id="senha" name="senha" class="form-control"
                placeholder="Senha">
        </div>
        <div class="form-group">
            <input type="text" id="cpf" name="cpf"  class="form-control" placeholder="CPF">
        </div>
        <div class="form-group">
             <input type="tel" id="telefone" name="telefone"  class="form-control" placeholder="Telefone">
        </div>
        <div class="form-group">
             <input type="date" id="dtnasc" name="dtnasc"  class="form-control" placeholder="Data de Nascimento">
        </div>
        <input type="submit" id="salvar" name="salvar" value="Salvar">
    </form>
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
        integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
        crossorigin="anonymous"></script>

        crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>

        $('.alert').alert();
