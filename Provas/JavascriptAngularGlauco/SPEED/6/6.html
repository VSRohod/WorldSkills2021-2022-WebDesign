  <body>
    <form>
      <label for="valor">Valor da diaria:</label>
      <input type="number" id="valor" name="valor" step="0.1" min="0" /><br />
      <label for="dia">Quantidade de dias:</label>
      <input type="number" id="dia" name="dia" step="1" min="0" /><br />
      Opcionais:<br />
      Banheiro(R$30,00)<input type="checkbox" id="banheiro"  />
      Banheira(R$100,00)<input type="checkbox" id="banheira"  />
      TV(R$40,00)<input type="checkbox" id="tv"  />
      Internet(R$80,00)<input type="checkbox" id="internet" /><br />
      <button id="calcular" type="button" name="calcular">CALCULAR</button>
    </form>
    <script src="6.js"></script>
  </body>
