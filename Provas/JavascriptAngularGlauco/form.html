<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usando formulário Js</title>
</head>
<body>
    <form>
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" required autofocus ><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br>
        <button type="button" id="enviar" name="enviar" value="1">ENVIAR</button>
        <button type="reset" id="resetar" name="resetar">RESETAR</button>
    </form>
<script>
    document.getElementById("enviar").addEventListener("click",getInfo);
    document.getElementById("limpar").addEventListener("mouseover",limparInfo);
    // document.getElementById("enviar").addEventListener('click',function(){
    //     getInfo();
    // });
    // btn.onclick = function(){
        
    // }

    function limparInfo() {
        document.clear();
    }

    function getInfo(){
         var nome, email , enviar, resetar;
         nome = document.getElementById("nome").value;
         email = document.getElementById("email").value;
         document.write(nome+"<br>");
         document.write(email+"<br>");
    }
</script>
</body>
</html>
