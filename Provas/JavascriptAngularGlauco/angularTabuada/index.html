<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
    <link rel="stylesheet" href="style/style.css">
    <title>Tabuada</title>
</head>
<body>
    <section ng-app="tabuada" ng-controller="MinhaTabuada" id="tabuadaSection">
        <input type="number" id="numero" name="numero" ng-model="numero" min="0" >
        <!-- <input type="number" id="numero2" name="numero2" ng-model="numero2" min="0" > -->
        <p id="textTabuada">TABUADA DE {{numero\}}</p>    
        <p ng-repeat="x in valor">{{x}} x {{numero}} = {{x * numero}}</p>

    </section>
    <script src="script/script.js"></script>
</body>
</html>
