<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldSkills Project</title>
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/configuracao.css" />
  </head>
  <body>
    <header>
      <img src="image/logo.jpeg" alt="" id="logo" />
      <h3 id="tituloLogo">WorldSkills Project</h3>
    </header>
    <div id="documento">
      <div id="next" class="navButton" data-target>
        <img src="image/next.png" alt="" class="iconsNav" />
      </div>
      <div id="prev" class="navButton" data-target>
        <img src="image/prev.png" alt="" class="iconsNav" />
      </div>
      <h1>TITULO 1</h1>
      <h2>TITULO 2</h2>
      <h3>TITULO 3</h3>
      <h4>TITULO 4</h4>
      <h5>TITULO 5</h5>
      <h6>TITULO 6</h6>
      <p>
        ISTO É UM TEXTO, isso é um texto,
        <b>isso é um texto</b>,
        <i>isso é um texto</i>
      </p>

      <div id="img">
        <img src="image/image.jpg" alt="" class="img" />
      </div>

      <div id="code">
        <div id="iconCode">
          <img
            src="image/copy_black.png"
            alt=""
            class="icons"
            id="copiar"
            data-target
          />
        </div>
        <textarea id="codeText" value="Olá">
          //COMO POSSO POR UM ALERT?
          <script>
              alert("Hello World");
          </script>
        </textarea>
      </div>

      <div id="nav">
        <div class="iconEsquerda" data-target>
          <img src="image/zoom_out.png" alt="" class="icons" id="zoom_out" />
        </div>
        <div class="iconEsquerda" data-target>
          <img src="image/zoom_in.png" alt="" class="icons" id="zoom_in" />
        </div>
        <div class="iconDireita" data-target>
          <img
            src="image/fullscreen.png"
            alt=""
            class="icons"
            id="fullscreen"
          />
        </div>
      </div>
    </div>
    <footer>@2021 WorldSkills - Project</footer>
  </body>
  <script src="script/script.js"></script>
</html>
